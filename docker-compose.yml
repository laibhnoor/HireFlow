services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hireflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hireflow}
      POSTGRES_DB: hireflow
    ports:
      - "5433:5432"
    volumes:
      - hireflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hireflow_pgdata:
